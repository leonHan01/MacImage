<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' file: data:; style-src 'self' 'unsafe-inline'; script-src 'self'">
    <title>MacImage - 图片浏览器</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div id="lockScreen" class="lock-screen">
        <div class="lock-content">
            <div class="lock-icon">
                <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                    <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                </svg>
            </div>
            <h2>MacImage</h2>
            <p class="lock-hint">请输入密码解锁</p>
            <input type="password" id="passwordInput" class="lock-input" placeholder="密码" autofocus>
            <p id="passwordError" class="lock-error">密码错误，请重试</p>
            <button id="unlockBtn" class="lock-btn">解锁</button>
        </div>
    </div>

    <div class="app-container">
        <aside class="sidebar">
            <div class="sidebar-header">
                <h2>标签筛选</h2>
                <button id="settingsBtn" class="icon-btn" title="设置">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="12" cy="12" r="3"></circle>
                        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
                    </svg>
                </button>
            </div>
            <div class="quick-add-tag">
                <input type="text" id="quickTagInput" placeholder="快速添加标签..." maxlength="20">
                <select id="quickTagCategory" class="tag-category-select" title="选择类别">
                    <option value="person">👤 人物</option>
                    <option value="landscape">🏞️ 风景</option>
                    <option value="object">📦 物品</option>
                    <option value="event">📅 事件</option>
                    <option value="emotion">❤️ 情感</option>
                    <option value="style">🎨 风格</option>
                    <option value="other" selected>📌 其他</option>
                </select>
                <button id="quickAddTagBtn" class="icon-btn" title="添加标签">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="12" y1="5" x2="12" y2="19"></line>
                        <line x1="5" y1="12" x2="19" y2="12"></line>
                    </svg>
                </button>
            </div>
            <div id="tagFilter" class="tag-filter">
                <div class="empty-state">请先添加标签</div>
            </div>
            <div class="sidebar-footer">
                <button id="openFolderBtn" class="primary-btn">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path>
                    </svg>
                    打开文件夹
                </button>
            </div>
        </aside>
        
        <main class="main-content">
            <div class="toolbar">
                <div class="current-folder" id="currentFolder"></div>
                <div class="image-count" id="imageCount"></div>
            </div>
            <div id="imageGrid" class="image-grid">
                <div class="empty-state">
                    <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1">
                        <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
                        <circle cx="8.5" cy="8.5" r="1.5"></circle>
                        <polyline points="21 15 16 10 5 21"></polyline>
                    </svg>
                    <p>点击"打开文件夹"选择图片目录</p>
                </div>
            </div>
        </main>
    </div>

    <div id="imageModal" class="modal">
        <div class="modal-backdrop"></div>
        <div class="modal-content">
            <button class="modal-close" id="modalClose">&times;</button>
            <div class="modal-body">
                <div class="modal-image-container">
                    <button class="modal-nav modal-prev" id="modalPrev">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <polyline points="15 18 9 12 15 6"></polyline>
                        </svg>
                    </button>
                    <img id="modalImage" src="" alt="">
                    <button class="modal-nav modal-next" id="modalNext">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <polyline points="9 18 15 12 9 6"></polyline>
                        </svg>
                    </button>
                </div>
                <div class="modal-sidebar">
                    <div class="modal-sidebar-header">
                        <h3>标签</h3>
                        <span id="modalImageIndex" class="image-index"></span>
                    </div>
                    <div class="modal-filename" id="modalFilename"></div>
                    <div class="modal-quick-add-tag">
                        <input type="text" id="modalQuickTagInput" placeholder="快速添加标签..." maxlength="20">
                        <select id="modalQuickTagCategory" class="tag-category-select" title="选择类别">
                            <option value="person">👤 人物</option>
                            <option value="landscape">🏞️ 风景</option>
                            <option value="object">📦 物品</option>
                            <option value="event">📅 事件</option>
                            <option value="emotion">❤️ 情感</option>
                            <option value="style">🎨 风格</option>
                            <option value="other" selected>📌 其他</option>
                        </select>
                        <button id="modalQuickAddTagBtn" class="icon-btn" title="添加标签">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <line x1="12" y1="5" x2="12" y2="19"></line>
                                <line x1="5" y1="12" x2="19" y2="12"></line>
                            </svg>
                        </button>
                    </div>
                    <div class="modal-tag-list" id="modalTagList">
                        <div class="empty-state">请先添加标签</div>
                    </div>
                    <div class="modal-sidebar-footer">
                        <button id="showInFolderBtn" class="secondary-btn" title="在 Finder 中显示">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path>
                            </svg>
                            在文件夹中显示
                        </button>
                        <button id="deleteBtn" class="delete-btn" title="删除图片 (Delete)">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <polyline points="3 6 5 6 21 6"></polyline>
                                <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
                            </svg>
                            删除图片
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div id="settingsModal" class="modal">
        <div class="modal-backdrop"></div>
        <div class="modal-content settings-content">
            <div class="settings-header">
                <h2>设置</h2>
                <button class="modal-close" id="settingsClose">&times;</button>
            </div>
            <div class="settings-body">
                <div class="settings-section">
                    <h3>回收站文件夹</h3>
                    <p class="settings-hint">删除的图片将移动到此文件夹</p>
                    <div id="trashFolderDisplay" class="trash-folder-display"></div>
                    <div class="trash-info-row">
                        <div id="trashInfo" class="trash-info"></div>
                        <button id="emptyTrashBtn" class="danger-btn" disabled>清空回收站</button>
                    </div>
                </div>
                
                <div class="settings-section">
                    <h3>安全设置</h3>
                    <p class="settings-hint">修改密码和自动锁定时间</p>
                    
                    <div class="password-change-form">
                        <input type="password" id="currentPassword" class="settings-input" placeholder="当前密码">
                        <input type="password" id="newPassword" class="settings-input" placeholder="新密码">
                        <input type="password" id="confirmPassword" class="settings-input" placeholder="确认新密码">
                        <p id="passwordChangeError" class="settings-error"></p>
                        <button id="changePasswordBtn" class="primary-btn">修改密码</button>
                    </div>
                    
                    <div class="timeout-setting">
                        <label>无操作自动锁定：</label>
                        <select id="lockTimeoutSelect" class="settings-select">
                            <option value="1">1 分钟</option>
                            <option value="3">3 分钟</option>
                            <option value="5" selected>5 分钟</option>
                            <option value="10">10 分钟</option>
                            <option value="15">15 分钟</option>
                            <option value="30">30 分钟</option>
                        </select>
                    </div>
                </div>
                
                <div class="settings-section">
                    <h3>分类管理</h3>
                    <p class="settings-hint">管理标签分类，可添加、编辑、删除分类</p>
                    <div class="add-category-form">
                        <input type="text" id="newCategoryName" placeholder="分类名称" maxlength="20">
                        <select id="newCategoryIcon" class="icon-select" title="选择图标">
                            <option value="📌">📌 图钉</option>
                            <option value="👤">👤 人物</option>
                            <option value="👥">👥 群组</option>
                            <option value="🏞️">🏞️ 风景</option>
                            <option value="🏔️">🏔️ 山峰</option>
                            <option value="🌊">🌊 海浪</option>
                            <option value="🌳">🌳 树木</option>
                            <option value="📦">📦 包裹</option>
                            <option value="📱">📱 手机</option>
                            <option value="💻">💻 电脑</option>
                            <option value="📷">📷 相机</option>
                            <option value="🚗">🚗 汽车</option>
                            <option value="🏠">🏠 房屋</option>
                            <option value="📅">📅 日历</option>
                            <option value="🎉">🎉 庆祝</option>
                            <option value="🎂">🎂 生日</option>
                            <option value="🎄">🎄 圣诞</option>
                            <option value="❤️">❤️ 红心</option>
                            <option value="💖">💖 爱心</option>
                            <option value="⭐">⭐ 星星</option>
                            <option value="🔥">🔥 火焰</option>
                            <option value="🎨">🎨 调色板</option>
                            <option value="🖼️">🖼️ 画框</option>
                            <option value="🎬">🎬 电影</option>
                            <option value="🎵">🎵 音乐</option>
                            <option value="📚">📚 书籍</option>
                            <option value="💼">💼 公文包</option>
                            <option value="🎮">🎮 游戏</option>
                            <option value="🏀">🏀 篮球</option>
                            <option value="⚽">⚽ 足球</option>
                            <option value="🍳">🍳 烹饪</option>
                            <option value="☕">☕ 咖啡</option>
                            <option value="🍕">🍕 披萨</option>
                            <option value="✈️">✈️ 飞机</option>
                            <option value="🌍">🌍 地球</option>
                            <option value="☀️">☀️ 太阳</option>
                            <option value="🌙">🌙 月亮</option>
                            <option value="💎">💎 钻石</option>
                            <option value="🔑">🔑 钥匙</option>
                            <option value="💡">💡 灯泡</option>
                        </select>
                        <button id="addCategoryBtn" class="primary-btn">添加</button>
                    </div>
                    <div class="category-list" id="categoryList">
                    </div>
                </div>
                
                <div class="settings-section">
                    <h3>标签管理</h3>
                    <div class="add-tag-form">
                        <input type="text" id="newTagInput" placeholder="输入新标签名称" maxlength="20">
                        <select id="newTagCategory" class="tag-category-select" title="选择类别">
                            <option value="person">👤 人物</option>
                            <option value="landscape">🏞️ 风景</option>
                            <option value="object">📦 物品</option>
                            <option value="event">📅 事件</option>
                            <option value="emotion">❤️ 情感</option>
                            <option value="style">🎨 风格</option>
                            <option value="other" selected>📌 其他</option>
                        </select>
                        <button id="addTagBtn" class="primary-btn">添加</button>
                    </div>
                    <div class="tag-list" id="tagList">
                        <div class="empty-state">暂无标签</div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="renderer.js"></script>
</body>
</html>
